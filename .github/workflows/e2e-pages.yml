---
name: End-to-end

# Publishes a test module to the Pages site of this repository and installs it with the go command
# through the real site. The test module is never requested from the public proxy.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.pack.outputs.version }}
      module: ${{ steps.pack.outputs.module }}
      h1: ${{ steps.pack.outputs.h1 }}
      proxy-url: ${{ steps.build.outputs.proxy-url }}
      base-url: ${{ steps.build.outputs.base-url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - id: pack
        uses: ./pack
        with:
          module-dir: tests/e2e/module
          version: v0.1.${{ github.run_number }}
          output: ${{ runner.temp }}/{name}-{version}.zip

      - id: build
        uses: ./
        with:
          zips: ${{ steps.pack.outputs.zip }}
          release-assets: ""
          modules: |
            udondan.github.io/goproxy-gh-pages/example
            udondan.github.io/goproxy-gh-pages/vanity git https://github.com/udondan/goproxy-gh-pages
            udondan.github.io/goproxy-gh-pages/external mod https://proxy.golang.org

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ steps.build.outputs.path }}
          name: github-pages-${{ github.run_attempt }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  verify:
    needs: [publish, deploy]
    runs-on: ubuntu-latest
    env:
      MODULE: ${{ needs.publish.outputs.module }}
      VERSION: ${{ needs.publish.outputs.version }}
      H1: ${{ needs.publish.outputs.h1 }}
      PROXY_URL: ${{ needs.publish.outputs.proxy-url }}
      BASE_URL: ${{ needs.publish.outputs.base-url }}
      # Only the Pages site is asked, never the public proxy or checksum database
      GONOSUMDB: udondan.github.io
      GOFLAGS: -mod=mod
    steps:
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: false

      - name: Wait for the site
        run: |
          for _ in $(seq 60); do
            if curl -fsS -o /dev/null "$PROXY_URL/$MODULE/@v/$VERSION.info"; then
              exit 0
            fi
            sleep 5
          done
          echo "::error::$PROXY_URL doesn't serve $MODULE@$VERSION"
          exit 1

      - name: Install through the go-import pages
        env:
          GOPROXY: direct
        run: |
          set -euo pipefail
          mkdir consumer && cd consumer
          go mod init example.com/consumer
          cat > main.go <<'EOF'
          package main

          import (
          	"fmt"

          	"udondan.github.io/goproxy-gh-pages/example"
          	"udondan.github.io/goproxy-gh-pages/example/greet"
          )

          func main() {
          	fmt.Println(example.Hello("proxy"), greet.Greeting("package"))
          }
          EOF
          go get "$MODULE@$VERSION"
          go run .
          grep -qF "$MODULE $VERSION $H1" go.sum

      - name: Install through the proxy URL
        env:
          GOPROXY: ${{ needs.publish.outputs.proxy-url }}
        run: |
          set -euo pipefail
          go list -m -versions "$MODULE" | grep -qw "$VERSION"
          test "$(go list -m -json "$MODULE@latest" | jq -r .Version)" = "$VERSION"
          go mod download -json "$MODULE@$VERSION" | jq -e --arg h1 "$H1" '.Sum == $h1'

      - name: Check the vanity and external pages
        run: |
          set -euo pipefail
          curl -fsS "$BASE_URL/vanity/?go-get=1" \
            | grep -qF 'content="udondan.github.io/goproxy-gh-pages/vanity git https://github.com/udondan/goproxy-gh-pages"'
          curl -fsS "$BASE_URL/external/?go-get=1" \
            | grep -qF 'content="udondan.github.io/goproxy-gh-pages/external mod https://proxy.golang.org"'
          # paths without a page get the 404 page, which has the go-import tags too
          curl -sS "$BASE_URL/external/deep/pkg/?go-get=1" \
            | grep -qF 'content="udondan.github.io/goproxy-gh-pages/external mod https://proxy.golang.org"'
