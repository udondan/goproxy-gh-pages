---
name: Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Codecov compares pull requests against the coverage of main.
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  # Queues the runs of pull requests and main, pull requests first, so only one
  # run is tested at a time. Pull requests from forks get a read-only token and
  # skip the wait. All other jobs wait for it: while another run holds the
  # turn, this one likely needs a rebase anyway.
  boarding-gate:
    name: Queue
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: write # lock refs under refs/boarding-gate/
      pull-requests: read # labels for label-weights
      statuses: write # queue position as commit status
    # Queue order, the concurrency group that cancels outdated waiting runs and
    # the rebase of branches that are behind main: see
    # https://github.com/udondan/boarding-gate#reusable-workflow
    # The rebase needs OVERRIDE_TOKEN: pushes with github.token don't start new runs.
    uses: udondan/boarding-gate/.github/workflows/boarding-gate.yml@v1
    secrets:
      update-token: ${{ secrets.OVERRIDE_TOKEN }}

  # The tests only run if code or build config changed. Skipped outside of
  # pull requests, so pushes to main always run them.
  changes:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the unit job.
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files via the API
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            code:
              - goproxy_gh_pages/**
              - tests/**
              - action.yml
              - pack/**
              - build/**
              - seed/**
              - run.sh
              - pyproject.toml
              - uv.lock
              - mise.toml
              - Makefile
              - codecov.yml
              - .github/workflows/test.yml

  # Runs on every change, as prettier also checks the docs.
  lint:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the unit job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # uv from mise.toml
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: uv

      - name: ruff check
        run: uv run ruff check . --output-format github

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: prettier
        run: make prettier

  unit:
    name: Unit tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    needs: [boarding-gate, changes]
    # A skipped job counts as passed for required checks. Run the job even if
    # boarding-gate failed and fail it in the first step. The wait is skipped
    # for forks. Skipped if no code changed.
    if: ${{ !cancelled() && (needs.changes.result == 'skipped' || (needs.changes.result == 'success' && needs.changes.outputs.code == 'true')) }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    env:
      UV_PYTHON: ${{ matrix.python }}
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # uv from mise.toml, Python from the matrix
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: uv

      - name: Test
        run: |
          uv run coverage run -m pytest
          uv run coverage report
          uv run coverage xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage.xml
          disable_search: true

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. If Codecov doesn't report in time, it passes with a warning
  # and only the 100% threshold of the tests is checked.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit]
    # !cancelled(): boarding-gate is skipped for forks.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.unit.result == 'success' }}
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, only the 100% threshold of the tests is checked."

  # The zips and hashes compared with golang.org/x/mod, and a built site used by the go command
  compat:
    name: Go compatibility
    needs: [boarding-gate, unit]
    # Only runs if the unit tests passed. They are skipped if no code changed.
    if: ${{ !cancelled() && needs.unit.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: tests/compat/go.mod
          cache-dependency-path: tests/compat/go.sum

      - name: Test
        run: make compat

  # The actions as users run them: with the Python of the runner, nothing installed
  action:
    name: Action (${{ matrix.os }})
    needs: [boarding-gate, unit]
    # Only runs if the unit tests passed. They are skipped if no code changed.
    if: ${{ !cancelled() && needs.unit.result == 'success' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Write a module
        run: |
          mkdir -p "$RUNNER_TEMP/module/sub"
          printf 'module example.com/action/test\n\ngo 1.21\n' > "$RUNNER_TEMP/module/go.mod"
          printf 'package test\n' > "$RUNNER_TEMP/module/test.go"
          printf 'package sub\n' > "$RUNNER_TEMP/module/sub/sub.go"

      - id: pack
        uses: ./pack
        with:
          module-dir: ${{ runner.temp }}/module
          version: 1.2.3
          output: ${{ runner.temp }}/{name}-{version}.zip
          time: "2024-01-02T03:04:05Z"

      - id: build
        uses: ./build
        with:
          base-url: https://example.com/action
          output: ${{ runner.temp }}/site
          zips: ${{ steps.pack.outputs.zip }}
          release-assets: ""
          mirror: false
          fallback-proxy: ""
          verify-sumdb: false

      - id: seed
        uses: ./seed
        with:
          versions: ""
          wait-for: none

      - name: Check outputs
        env:
          ZIP: ${{ steps.pack.outputs.zip }}
          MODULE: ${{ steps.pack.outputs.module }}
          VERSION: ${{ steps.pack.outputs.version }}
          TIME: ${{ steps.pack.outputs.time }}
          H1: ${{ steps.pack.outputs.h1 }}
          SITE: ${{ steps.build.outputs.path }}
          PROXY_URL: ${{ steps.build.outputs.proxy-url }}
          NEW_VERSIONS: ${{ steps.build.outputs.new-versions }}
          AVAILABLE: ${{ steps.seed.outputs.available }}
        run: |
          set -euo pipefail
          test -f "$ZIP"
          test "$MODULE" = example.com/action/test
          test "$VERSION" = v1.2.3
          test "$TIME" = 2024-01-02T03:04:05Z
          [[ "$H1" == h1:* ]]
          test "$PROXY_URL" = https://example.com/action/go
          test "$NEW_VERSIONS" = '["example.com/action/test@v1.2.3"]'
          test "$AVAILABLE" = '{}'
          test "$(cat "$SITE/go/example.com/action/test/@v/list")" = v1.2.3
          grep -q '"Version":"v1.2.3"' "$SITE/go/example.com/action/test/@v/v1.2.3.info"
          grep -q 'content="example.com/action/test mod https://example.com/action/go"' "$SITE/test/sub/index.html"

  benchmark:
    needs: [boarding-gate, unit]
    # Only runs if the unit tests passed. They are skipped if no code changed.
    if: ${{ !cancelled() && needs.unit.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # uv from mise.toml
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: uv

      - name: Benchmark
        run: make bench

  workflows:
    needs: boarding-gate
    # Fail instead of skip if boarding-gate failed, see the unit job.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check turn
        if: needs.boarding-gate.result == 'failure' || needs.boarding-gate.result == 'cancelled'
        run: exit 1

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: shellcheck
        run: shellcheck run.sh tests/compat/*.sh

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs:
      - boarding-gate
      - changes
      - lint
      - unit
      - coverage
      - compat
      - action
      - benchmark
      - workflows
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
