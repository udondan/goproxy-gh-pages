---
name: Test

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
  # Codecov compares pull requests against the coverage of main.
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: ruff check
        run: uv run ruff check . --output-format github

      - name: ruff format
        run: uv run ruff format --check .

      - name: mypy
        run: uv run mypy

      - name: prettier
        run: make prettier

  unit:
    name: Unit tests (Python ${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write # Codecov upload via OIDC
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}

      - name: Test
        run: |
          uv run coverage run -m pytest
          uv run coverage report
          uv run coverage xml

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.14'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: false
          files: coverage.xml
          disable_search: true

  # Codecov reports its result as the check runs codecov/project and
  # codecov/patch. This job waits for them, so a coverage drop fails the
  # required job. It passes with a warning if Codecov doesn't report in time.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [unit]
    if: github.event_name == 'pull_request' && needs.unit.result == 'success'
    timeout-minutes: 10
    permissions:
      checks: read
    steps:
      - name: Wait for Codecov
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for _ in $(seq 30); do
            checks=$(gh api --paginate --slurp "repos/$REPO/commits/$SHA/check-runs?per_page=100" | jq -c '
              [.[].check_runs[] | select(.app.slug == "codecov" and (.name == "codecov/project" or .name == "codecov/patch"))]
              | group_by(.name) | map(max_by(.id))')
            if [[ $(jq '[.[] | select(.status == "completed")] | length' <<<"$checks") == 2 ]]; then
              jq -r '.[] | "\(.name): \(.conclusion) (\(.output.title))"' <<<"$checks"
              failed=$(jq -r '.[] | select(.conclusion != "success" and .conclusion != "neutral") | .name' <<<"$checks")
              if [[ -n "$failed" ]]; then
                echo "::error::Coverage check failed: ${failed//$'\n'/, }. Details are linked in the checks of this pull request."
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo "::warning::Codecov didn't report within 5 minutes, coverage is not checked."

  # The zips and hashes compared with golang.org/x/mod, and a built site used by the go command
  compat:
    name: Go compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@v7
        with:
          go-version-file: tests/compat/go.mod
          cache-dependency-path: tests/compat/go.sum

      - name: Test
        run: make compat

  # The actions as users run them: with the Python of the runner, nothing installed
  action:
    name: Action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Write a module
        run: |
          mkdir -p "$RUNNER_TEMP/module/sub"
          printf 'module example.com/action/test\n\ngo 1.21\n' > "$RUNNER_TEMP/module/go.mod"
          printf 'package test\n' > "$RUNNER_TEMP/module/test.go"
          printf 'package sub\n' > "$RUNNER_TEMP/module/sub/sub.go"

      - id: pack
        uses: ./pack
        with:
          module-dir: ${{ runner.temp }}/module
          version: 1.2.3
          output: ${{ runner.temp }}/{name}-{version}.zip
          time: "2024-01-02T03:04:05Z"

      - id: build
        uses: ./
        with:
          base-url: https://example.com/action
          output: ${{ runner.temp }}/site
          zips: ${{ steps.pack.outputs.zip }}
          release-assets: ""
          mirror: false
          fallback-proxy: ""
          verify-sumdb: false

      - id: seed
        uses: ./seed
        with:
          versions: ""
          wait-for: none

      - name: Check outputs
        env:
          ZIP: ${{ steps.pack.outputs.zip }}
          MODULE: ${{ steps.pack.outputs.module }}
          VERSION: ${{ steps.pack.outputs.version }}
          TIME: ${{ steps.pack.outputs.time }}
          H1: ${{ steps.pack.outputs.h1 }}
          SITE: ${{ steps.build.outputs.path }}
          PROXY_URL: ${{ steps.build.outputs.proxy-url }}
          NEW_VERSIONS: ${{ steps.build.outputs.new-versions }}
          AVAILABLE: ${{ steps.seed.outputs.available }}
        run: |
          set -euo pipefail
          test -f "$ZIP"
          test "$MODULE" = example.com/action/test
          test "$VERSION" = v1.2.3
          test "$TIME" = 2024-01-02T03:04:05Z
          [[ "$H1" == h1:* ]]
          test "$PROXY_URL" = https://example.com/action/go
          test "$NEW_VERSIONS" = '["example.com/action/test@v1.2.3"]'
          test "$AVAILABLE" = '{}'
          test "$(cat "$SITE/go/example.com/action/test/@v/list")" = v1.2.3
          grep -q '"Version":"v1.2.3"' "$SITE/go/example.com/action/test/@v/v1.2.3.info"
          grep -q 'content="example.com/action/test mod https://example.com/action/go"' "$SITE/test/sub/index.html"

  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Benchmark
        run: make bench

  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          install_args: actionlint shellcheck zizmor

      # Also runs shellcheck over every `run:` block.
      - name: actionlint
        run: actionlint

      - name: shellcheck
        run: shellcheck run.sh tests/compat/*.sh

      - name: zizmor
        run: zizmor .
        env:
          GH_TOKEN: ${{ github.token }} # zizmor checks the actions online

  # The only test check the ruleset requires, whatever jobs are added later.
  required:
    needs: [lint, unit, coverage, compat, action, benchmark, workflows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
