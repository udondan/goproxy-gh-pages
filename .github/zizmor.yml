# First-party actions keep their version tags, everything else is pinned to a commit SHA.
# The reusable workflow of boarding-gate is used by its major tag, so every
# release reaches this repo without update PRs.
rules:
  unpinned-uses:
    config:
      policies:
        "actions/*": ref-pin
        "github/*": ref-pin
        "udondan/boarding-gate/*": ref-pin
        "*": hash-pin
  # The actions of this repository are tested from the checkout with `uses: ./<action>`. actionlint
  # doesn't know the `$/` syntax yet.
  self-repository:
    disable: true
