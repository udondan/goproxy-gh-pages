# Configuration of the development tools. The action has no dependencies: it runs on the Python
# standard library of the runner, nothing is installed.
[project]
name = "goproxy-gh-pages"
version = "1.0.0"
description = "Serve Go modules from GitHub Pages as a static Go module proxy"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
  "coverage==7.13.1",
  "mypy==1.19.1",
  "pytest==9.0.2",
  "ruff==0.14.10",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "BLE", "C4", "SIM", "RUF", "PL", "S", "PT"]
ignore = [
  "PLR0911", # many returns
  "PLR0912", # many branches
  "PLR0913", # many arguments
  "PLR0915", # many statements
  "PLR2004", # magic values
  "S310",    # urllib with URLs from inputs is the point
  "S311",    # random is for jitter
  "S603",    # subprocess without shell
  "S607",    # git from PATH
  "RUF001",  # ambiguous characters in strings
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S104", "S105", "S106", "S108", "S311", "PLC0415", "BLE001"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["goproxy_gh_pages", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["goproxy_gh_pages"]
# runs as a script; tested in a subprocess
omit = ["goproxy_gh_pages/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]
